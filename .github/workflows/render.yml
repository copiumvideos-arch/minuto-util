# Renders one video on a schedule and sends it to the owner's Telegram with "Publicar" and "Rejeitar" buttons.
# The buttons reach relay/ (a Cloudflare Worker), which starts publish.yml. Nothing is posted from here.
name: render

on:
  schedule:
    # 07:00, 11:00, 15:00 and 19:00 in Brasília (UTC-3). GitHub may start scheduled runs some minutes late.
    # Four a day keeps one of TikTok's five daily inbox drafts spare.
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      article:
        description: "An idea or English Wikipedia article to make now (empty: approved ideas, then config/topics.json)"
        required: false
        default: ""
      remake:
        description: "A run tag (yyyyMMdd-HHmm) to make again with a new script, voice and pictures"
        required: false
        default: ""

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CLI: dotnet src/MinutoUtil.Cli/bin/Release/net10.0/minuto-util.dll
      MINUTO_TELEGRAM_BOT_TOKEN: ${{ secrets.MINUTO_TELEGRAM_BOT_TOKEN }}
      MINUTO_TELEGRAM_CHAT_ID: ${{ secrets.MINUTO_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - name: Run tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      # A static FFmpeg 8.1 build (with libass) from GitHub, cached: the Ubuntu mirror once took 16 minutes for apt.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-linux64-gpl-v1
      - name: FFmpeg
        run: |
          if [ ! -x ~/ffmpeg/bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz               | tar -xJ -C ~/ffmpeg --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          ~/ffmpeg/bin/ffmpeg -hide_banner -filters | grep -q " ass " || { echo "this FFmpeg has no libass"; exit 1; }
      # Whisper small, Depth Anything V2 Small, Kokoro and the Natural Earth map data, downloaded once.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            assets/cache
          key: models-v1

      - name: Build
        run: |
          (cd tools && uv sync --frozen --no-dev)
          dotnet build src/MinutoUtil.Cli -c Release -v q

      - name: Pick the topic
        id: next
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ARTICLE: ${{ inputs.article }}
          REMAKE: ${{ inputs.remake }}
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          if [ -n "$REMAKE" ]; then
            $CLI cloud next --state state --tag "$TAG" --remake "$REMAKE" > next.json
          else
            $CLI cloud next --state state --tag "$TAG" --article "$ARTICLE" > next.json
          fi
          code=$?
          set -e
          # A remake replaces the old video: its release goes (the run record is already marked rejected).
          if [ "$code" = "0" ] && [ -n "$REMAKE" ]; then gh release delete "run-$REMAKE" --cleanup-tag --yes || true; fi
          if [ "$code" = "3" ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          cat next.json

      - name: Render
        if: steps.next.outputs.empty != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMALLEST_API_KEY: ${{ secrets.SMALLEST_API_KEY }}
        run: |
          article=$(jq -r .article next.json)
          year=$(jq -r .year next.json)
          topic=$(jq -r .topic next.json)
          portuguese=$(jq -r .portugueseArticle next.json)
          $CLI make --run "output/$TAG" --article "$article" --portuguese-article "$portuguese" --year "$year" --topic "$topic" \
            --quota-file state/quota-state.json

      - name: Keep the video
        if: steps.next.outputs.empty != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(jq -r .title "output/$TAG/metadata.json")
          gh release create "run-$TAG" --prerelease --title "$title" \
            --notes "Rendered by run $GITHUB_RUN_ID; waiting for review on Telegram." \
            "output/$TAG/video.mp4" "output/$TAG/metadata.json" "output/$TAG/run.log" "output/$TAG/contact-sheet.png"

      - name: Send for review
        if: steps.next.outputs.empty != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: $CLI cloud review --state state --tag "$TAG" --run "output/$TAG"

      - name: Report the failure
        if: failure() && steps.next.outcome == 'success'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason=$(grep -h " WARN " "output/$TAG/run.log" 2>/dev/null | tail -n 1 | cut -c 15- || true)
          $CLI cloud failed --state state --tag "$TAG" --reason "${reason:-a etapa do GitHub Actions falhou}" --log-url "$LOG_URL"

      - name: Save the state
        if: always() && steps.tag.outcome == 'success'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash .github/scripts/save-state.sh "render $TAG"
