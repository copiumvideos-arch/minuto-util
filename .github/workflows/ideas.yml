# The bot's quick jobs (ideas, the queue, settings, status, stats, title edits). The owner's say in what gets made. Every morning: 10 ideas from the day's trends go to Telegram with a button each.
# relay/ starts this workflow again when the owner taps an idea (approve) or sends a text idea (add); approved ideas
# and text ideas go ahead of the channel's topics.json in render.yml.
# A run started by hand (or by the relay) names its channel; a scheduled run makes the list for every channel whose
# channel.ideasUtcHours has that hour, one matrix job each (tools/channels.py).
name: ideas
run-name: ideas ${{ inputs.channel }} ${{ inputs.action || 'list' }}

on:
  schedule:
    # One line per hour in any channel's channel.ideasUtcHours (a test checks they match), always at minute 0.
    # Minuto Útil and Profissão Spoiler: 06:00 in Brasília (UTC-3), before the first render.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "The channel (a folder in channels/)"
        required: false
        default: minuto-util
      action:
        type: choice
        options: [list, approve, add, queue, top, remove, move, settings, status, stats, title]
        default: list
      item:
        description: "top, remove, move: the queue item (a key or its position); settings: review-on, review-off, pause, resume; title: the run tag"
        required: false
        default: ""
      date:
        description: "approve: the list's date (yyyyMMdd)"
        required: false
        default: ""
      index:
        description: "approve: the idea's number in that list; move: the new position"
        required: false
        default: ""
      idea:
        description: "add: the owner's idea, a subject or a question; title: the new title"
        required: false
        default: ""
      again:
        description: "list: send a new list even if today's was sent"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  channels:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the channels
        id: pick
        env:
          CHANNEL: ${{ inputs.channel }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          list=$(python3 tools/channels.py matrix ideasUtcHours)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  ideas:
    needs: channels
    if: needs.channels.outputs.list != '[]'
    name: ideas ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.channels.outputs.list) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The app for this channel: CH_<NAME> variables reach it as <prefix>_<NAME> (.github/scripts/cli.sh).
      CLI: bash .github/scripts/cli.sh
      CHANNEL: ${{ matrix.id }}
      PREFIX: ${{ matrix.prefix }}
      RELEASE: ${{ matrix.release }}
      ACTION: ${{ inputs.action || 'list' }}
      DATE: ${{ inputs.date }}
      INDEX: ${{ inputs.index }}
      IDEA: ${{ inputs.idea }}
      ITEM: ${{ inputs.item }}
      AGAIN: ${{ inputs.again && '--again' || '' }}
    steps:
      - name: Check the input
        run: |
          case "$ACTION" in
            list) ;;
            approve) [[ "$DATE" =~ ^[0-9]{8}$ && "$INDEX" =~ ^[0-9]{1,2}$ ]] || { echo "bad date or index"; exit 1; } ;;
            add) [ -n "$IDEA" ] && [ "${#IDEA}" -le 200 ] || { echo "bad idea"; exit 1; } ;;
            queue) ;;
            top|remove) [[ "$ITEM" =~ ^[0-9a-z-]{1,40}$ ]] || { echo "bad item"; exit 1; } ;;
            move) [[ "$ITEM" =~ ^[0-9a-z-]{1,40}$ && "$INDEX" =~ ^[0-9]{1,2}$ ]] || { echo "bad item or position"; exit 1; } ;;
            settings) [[ "$ITEM" =~ ^(review-on|review-off|pause|resume)$ ]] || { echo "bad setting"; exit 1; } ;;
            status|stats) ;;
            title) [[ "$ITEM" =~ ^[0-9]{8}-[0-9]{4}$ ]] && [ -n "$IDEA" ] && [ "${#IDEA}" -le 100 ] || { echo "bad tag or title"; exit 1; } ;;
            *) echo "bad action"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: state
          path: state
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/MinutoUtil.Cli -c Release -v q

      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          CH_STATE_DIR: ${{ github.workspace }}/${{ matrix.state }}
          CH_STATE_KEY: ${{ secrets[format('{0}_STATE_KEY', matrix.prefix)] }}
          CH_GOOGLE_CLIENT_ID: ${{ secrets[format('{0}_GOOGLE_CLIENT_ID', matrix.prefix)] }}
          CH_GOOGLE_CLIENT_SECRET: ${{ secrets[format('{0}_GOOGLE_CLIENT_SECRET', matrix.prefix)] }}
          CH_YOUTUBE_REFRESH_TOKEN: ${{ secrets[format('{0}_YOUTUBE_REFRESH_TOKEN', matrix.prefix)] }}
          CH_TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}_TELEGRAM_BOT_TOKEN', matrix.prefix)] }}
          CH_TELEGRAM_CHAT_ID: ${{ secrets[format('{0}_TELEGRAM_CHAT_ID', matrix.prefix)] }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$ACTION" in
            list) $CLI cloud ideas --state state $AGAIN ;;
            approve) $CLI cloud approve --state state --date "$DATE" --index "$INDEX" ;;
            add) $CLI cloud add-idea --state state --idea "$IDEA" ;;
            queue) $CLI cloud queue --state state ;;
            top) $CLI cloud queue --state state --top "$ITEM" ;;
            remove) $CLI cloud queue --state state --remove "$ITEM" ;;
            move) $CLI cloud queue --state state --move "$ITEM" --to "$INDEX" ;;
            settings) $CLI cloud settings --state state --set "$ITEM" ;;
            status) $CLI cloud status --state state ;;
            stats) $CLI cloud stats --state state ;;
            title)
              # The title publish.yml will use lives in the run's metadata.json, kept with its release.
              mkdir -p "output/$ITEM"
              gh release download "$RELEASE$ITEM" -D "output/$ITEM" -p metadata.json
              $CLI cloud title --state state --tag "$ITEM" --run "output/$ITEM" --title "$IDEA"
              gh release upload "$RELEASE$ITEM" "output/$ITEM/metadata.json" --clobber
              gh release edit "$RELEASE$ITEM" --title "$IDEA" ;;
          esac

      - name: Save the state
        if: always()
        run: bash .github/scripts/save-state.sh "ideas $CHANNEL $ACTION"
